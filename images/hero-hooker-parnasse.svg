<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#131316"/>
      <rect width="8" height="16" fill="#17171b"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#stripes)"/>
  <circle cx="200" cy="160" r="135" fill="none" stroke="#d4a24e" stroke-opacity="0.18" stroke-width="3"/>
  <circle cx="200" cy="160" r="100" fill="none" stroke="#e0263e" stroke-opacity="0.12" stroke-width="2"/>

  <!-- Hooker: tall, rangy kickboxing stance -->
  <g fill="#e0263e" transform="translate(18,95) scale(1.05)">
    <circle cx="60" cy="30" r="12"/>
    <polygon points="46,40 76,40 84,80 68,105 48,102 38,78"/>
    <polygon points="48,102 40,102 26,155 40,160 56,108"/>
    <polygon points="68,105 80,102 98,140 112,148 94,152 76,108"/>
    <polygon points="44,44 22,36 4,58 16,68 42,54"/>
    <polygon points="80,44 100,50 118,80 106,88 84,58"/>
  </g>

  <!-- Parnasse: compact, coiled kickboxing/muay thai stance, mirrored -->
  <g fill="#d4a24e" transform="translate(382,120) scale(-1,1)">
    <circle cx="62" cy="18" r="12"/>
    <polygon points="48,28 78,28 86,68 70,92 50,90 40,66"/>
    <polygon points="50,90 42,90 24,145 38,150 56,96"/>
    <polygon points="70,92 82,90 102,132 116,140 98,144 78,96"/>
    <polygon points="46,32 28,24 30,50 46,54 52,42"/>
    <polygon points="82,32 102,26 122,44 112,56 88,46"/>
  </g>

  <text x="200" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f3f3f2" text-anchor="middle" letter-spacing="3">VS</text>

  <rect x="0" y="292" width="120" height="8" fill="#e0263e"/>
  <rect x="280" y="292" width="120" height="8" fill="#d4a24e"/>
</svg>
