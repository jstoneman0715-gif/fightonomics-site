    <circle cx="70" cy="14" r="11"/>
    <polygon points="57,24 83,24 90,78 76,100 54,100 46,78"/>
    <polygon points="54,100 47,100 26,164 38,169 60,106"/>
    <polygon points="76,100 85,100 98,148 112,172 96,176 80,108"/>
