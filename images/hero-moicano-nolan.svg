  <text x="200" y="74" font-family="Arial, sans-serif" font-size="32" font-weight="800" fill="#f3f3f2" text-anchor="middle" letter-spacing="3">VS</text>

  <rect x="0" y="292" width="120" height="8" fill="#e0263e"/>
  <rect x="280" y="292" width="120" height="8" fill="#d4a24e"/>
