<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="stripes" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="16" height="16" fill="#131316"/>
      <rect width="8" height="16" fill="#17171b"/>
    </pattern>
  </defs>
  <rect width="400" height="300" fill="url(#stripes)"/>
  <circle cx="200" cy="160" r="135" fill="none" stroke="#d4a24e" stroke-opacity="0.18" stroke-width="3"/>
  <circle cx="200" cy="160" r="100" fill="none" stroke="#e0263e" stroke-opacity="0.12" stroke-width="2"/>

  <!-- title belt motif -->
  <rect x="150" y="18" width="100" height="26" rx="6" fill="#d4a24e" opacity="0.85"/>
  <rect x="182" y="14" width="36" height="34" rx="5" fill="#e0263e" opacity="0.9"/>
  <text x="200" y="36" font-family="Arial, sans-serif" font-size="10" font-weight="800" fill="#0b0b0d" text-anchor="middle" letter-spacing="1">WFLW TITLE</text>

  <!-- Natalia Silva: compact striker stance -->
  <g fill="#e0263e" transform="translate(26,122) scale(0.95)">
    <circle cx="60" cy="42" r="12"/>
    <polygon points="42,52 76,52 86,86 68,106 46,104 36,84"/>
    <polygon points="46,104 38,104 24,148 38,154 54,110"/>
    <polygon points="68,106 80,104 96,140 110,148 94,152 76,110"/>
    <polygon points="44,56 26,52 12,76 24,84 42,66"/>
    <polygon points="78,56 96,60 112,86 100,94 80,68"/>
  </g>

  <!-- Wang Cong: upright kickboxing stance, mirrored -->
  <g fill="#d4a24e" transform="translate(374,112) scale(-0.95,0.95)">
    <circle cx="64" cy="18" r="12"/>
    <polygon points="50,28 80,28 88,70 72,94 52,92 42,68"/>
    <polygon points="52,92 44,92 26,146 40,151 58,98"/>
    <polygon points="72,94 84,92 104,134 118,154 100,158 80,100"/>
    <polygon points="48,32 30,24 32,50 48,54 54,42"/>
    <polygon points="84,32 104,26 124,44 114,56 90,46"/>
  </g>

  <text x="200" y="52" font-family="Arial, sans-serif" font-size="30" font-weight="800" fill="#f3f3f2" text-anchor="middle" letter-spacing="3">VS</text>

  <rect x="0" y="292" width="120" height="8" fill="#e0263e"/>
  <rect x="280" y="292" width="120" height="8" fill="#d4a24e"/>
</svg>
